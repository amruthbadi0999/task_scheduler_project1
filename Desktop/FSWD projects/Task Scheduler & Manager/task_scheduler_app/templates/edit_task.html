<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% if tasks %}
  {% for task in tasks %}
    {% if task[4] == 'Pending' and task[3] == today|string %}
      <div class="toast">
        📢 Reminder: "{{ task[1] }}" is due today!
      </div>
    
    {% endif %}
  {% endfor %}
{% endif %}

    
    <h1>Edit Task</h1>
    <form method="POST">
        <label>Title:</label><br>
        <input type="text" name="title" value="{{ task[1] }}" required><br><br>
        
        <label>Description:</label><br>
        <textarea name="description">{{ task[2] }}</textarea><br><br>
        
        <label>Due Date:</label><br>
        <input type="date" name="due_date" value="{{ task[3] }}" required><br><br>
        
        <label>Status:</label><br>
        <select name="status">
            <option value="Pending" {% if task[4] == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="Completed" {% if task[4] == 'Completed' %}selected{% endif %}>Completed</option>
        </select><br><br>

        <button type="submit">Update Task</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">⬅️ Back to Dashboard</a>
</body>
</html>
